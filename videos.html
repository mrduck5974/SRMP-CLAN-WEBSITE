  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .video-hero {
      text-align: center;
      padding: 65px 20px;
      background: linear-gradient(135deg, #17172b, #30104a, #101020);
    }

    .video-hero h2 {
      font-size: clamp(30px, 5vw, 48px);
      margin-bottom: 12px;
      color: #b77aff;
    }

    .video-hero p {
      color: #ccc;
      font-size: 17px;
    }

    .video-library {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .video-library > h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 30px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 25px;
    }

    .video-card {
      background: #17171f;
      border: 1px solid #333344;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .video-card:hover {
      transform: translateY(-5px);
      border-color: #a855f7;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: 0;
      background: #050508;
    }

    video.video-frame {
      object-fit: contain;
    }

    .video-info {
      padding: 16px;
    }

    .video-info h3 {
      margin: 0 0 10px;
      color: #c084fc;
      font-size: 19px;
    }

    .video-info p {
      color: #ccc;
      line-height: 1.5;
      margin: 0;
    }

    .back-section {
      text-align: center;
      padding: 10px 20px 50px;
    }

    .back-button {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: #9333ea;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }

    .back-button:hover {
      background: #7e22ce;
    }

    .empty-message {
      text-align: center;
      color: #aaa;
      padding: 25px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #aaa;
      border-top: 1px solid #292933;
    }
  </style>
</head>
